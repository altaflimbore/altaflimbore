<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aurora Bank • Transactions</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
  <link rel="icon" href="assets/img/transactions.svg" />
  <meta name="color-scheme" content="light dark" />
  <script type="module" src="assets/js/utils.js" defer></script>
  <script type="module" src="assets/js/transactions.js" defer></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="logo">
        <img src="assets/img/bank.svg" alt="Aurora" width="28" height="28" />
        <strong>Aurora Bank</strong>
      </div>
      <nav class="nav">
        <a href="dashboard.html"><img src="assets/img/dashboard.svg" alt=""/>Dashboard</a>
        <a href="bills.html"><img src="assets/img/bills.svg" alt=""/>Bills</a>
        <a href="loans.html"><img src="assets/img/loans.svg" alt=""/>Loans</a>
        <a class="active" href="transactions.html"><img src="assets/img/transactions.svg" alt=""/>Transactions</a>
        <a href="cards.html"><img src="assets/img/cards.svg" alt=""/>Cards</a>
        <a href="#" id="logoutLink"><img src="assets/img/logout.svg" alt=""/>Logout</a>
      </nav>
    </aside>
    <main class="content">
      <div class="topbar">
        <h2>Transactions</h2>
        <div class="actions">
          <button id="themeToggle" class="icon-btn" title="Toggle theme">
            <img src="assets/img/theme.svg" alt="theme" />
          </button>
        </div>
      </div>

      <section class="card">
        <div class="grid cols-3">
          <div class="form-field">
            <label for="filterType">Type</label>
            <select id="filterType">
              <option value="">All</option>
              <option>Deposit</option>
              <option>Withdraw</option>
              <option>Transfer</option>
              <option>Bill Payment</option>
              <option>Card Payment</option>
              <option>UPI Payment</option>
            </select>
          </div>
          <div class="form-field">
            <label for="startDate">Start</label>
            <input id="startDate" type="date" />
          </div>
          <div class="form-field">
            <label for="endDate">End</label>
            <input id="endDate" type="date" />
          </div>
        </div>
        <div style="margin-top: .8rem; display:flex; gap:.6rem;">
          <button id="applyFilters" class="btn btn-surface">Apply Filters</button>
          <button id="resetFilters" class="btn btn-surface">Reset</button>
          <button id="exportCsv" class="btn btn-primary">Export CSV</button>
        </div>
      </section>

      <section class="card" style="margin-top:1rem;">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Date</th>
                <th>Type</th>
                <th>Note</th>
                <th>Amount</th>
              </tr>
            </thead>
            <tbody id="txTable"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script type="module">
    import { guardAuth, initializeTheme, attachLogout } from './assets/js/utils.js';
    guardAuth();
    initializeTheme();
    attachLogout();
  </script>
</body>
</html>
