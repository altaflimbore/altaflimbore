<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aurora Bank • Reset Password</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
  <link rel="icon" href="assets/img/bank.svg" />
  <meta name="color-scheme" content="light dark" />
  <script type="module" src="assets/js/auth.js" defer></script>
  <script type="module" src="assets/js/utils.js" defer></script>
</head>
<body class="auth-body">
  <main class="auth-container">
    <section class="brand-pane small">
      <div class="brand-logo">
        <img src="assets/img/bank.svg" alt="Aurora Bank" />
        <h1>Password Reset</h1>
      </div>
      <p>Enter your account email and a new password.</p>
    </section>
    <section class="auth-card">
      <form id="resetForm" class="form">
        <div class="form-field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" placeholder="you@example.com" required />
        </div>
        <div class="form-field">
          <label for="newPassword">New Password</label>
          <input id="newPassword" name="newPassword" type="password" placeholder="••••••••" minlength="6" required />
        </div>
        <button type="submit" class="btn btn-primary w-full">Reset Password</button>
      </form>
      <div class="auth-links">
        <a href="index.html">Back to login</a>
      </div>
    </section>
  </main>
  <script type="module">
    import { initializeTheme } from './assets/js/utils.js';
    initializeTheme();
  </script>
</body>
</html>
