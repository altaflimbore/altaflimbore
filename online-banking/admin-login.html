<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aurora Bank • Admin Login</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
  <link rel="icon" href="assets/img/admin.svg" />
  <meta name="color-scheme" content="light dark" />
  <script type="module" src="assets/js/auth.js" defer></script>
  <script type="module" src="assets/js/utils.js" defer></script>
</head>
<body class="auth-body">
  <main class="auth-container">
    <section class="brand-pane small">
      <div class="brand-logo">
        <img src="assets/img/admin.svg" alt="Admin" />
        <h1>Admin Console</h1>
      </div>
      <p>Restricted access. Authorized personnel only.</p>
    </section>
    <section class="auth-card">
      <form id="adminLoginForm" class="form">
        <div class="form-field">
          <label for="email">Admin Email</label>
          <input id="email" name="email" type="email" placeholder="admin@bank.com" required />
        </div>
        <div class="form-field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn btn-primary w-full">Log In</button>
      </form>
      <div class="auth-links">
        <a href="index.html">Back to user login</a>
      </div>
    </section>
  </main>
  <script type="module">
    import { initializeTheme } from './assets/js/utils.js';
    initializeTheme();
  </script>
</body>
</html>
